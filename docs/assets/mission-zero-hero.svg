<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">MISSION ZERO — The Lunar Expedition</title>
  <desc id="desc">AI-assisted concept illustration of a spacecraft following a transfer route from Earth to the Moon. Not a gameplay screenshot.</desc>
  <defs>
